name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_B64" || -z "$CERT_PASSWORD" ]]; then
            echo "Missing signing certificate secrets." >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/developer_id_application.p12"

          if ! echo "$CERT_B64" | base64 --decode > "$CERT_PATH" 2>/dev/null; then
            echo "$CERT_B64" | base64 -D > "$CERT_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # The runner doesn't ship Apple's Developer ID G2 intermediate; without it the identity isn't valid for codesign.
          INTERMEDIATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -sfL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$INTERMEDIATE_PATH"
          security import "$INTERMEDIATE_PATH" -k "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Configure notarytool profile
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Missing notarization secrets." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "AC_NOTARY" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build signed + notarized DMG
        env:
          VERSION: ${{ github.ref_name }}
          DEV_ID_APP_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          chmod +x scripts/release.sh
          CLEAN_VERSION="${VERSION#v}"
          VERSION="$CLEAN_VERSION" \
          NOTARY_PROFILE="AC_NOTARY" \
          scripts/release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerPulse-dmg
          path: build/*.dmg

      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "Missing SPARKLE_ED_PRIVATE_KEY secret." >&2
            exit 1
          fi

          CLEAN_VERSION="${VERSION#v}"
          DMG_NAME="ServerPulse-$CLEAN_VERSION.dmg"
          SIGNATURE_ATTRS="$(echo "$SPARKLE_ED_PRIVATE_KEY" \
            | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "build/$DMG_NAME")"

          cat > build/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>ServerPulse</title>
              <item>
                <title>$CLEAN_VERSION</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$CLEAN_VERSION</sparkle:version>
                <sparkle:shortVersionString>$CLEAN_VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>$REPO_URL/releases/tag/$VERSION</sparkle:fullReleaseNotesLink>
                <enclosure url="$REPO_URL/releases/download/$VERSION/$DMG_NAME" type="application/octet-stream" $SIGNATURE_ATTRS />
              </item>
            </channel>
          </rss>
          EOF

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/appcast.xml
          generate_release_notes: true
