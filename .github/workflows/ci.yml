name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - polish-and-env
      - security-and-simplification

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
